<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كاشير المحل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20201C;
    --green-900:#122A20;
    --green-800:#1F3A2E;
    --green-700:#2B4E3D;
    --paper:#FBF7EE;
    --paper-dark:#F1EAD9;
    --amber:#C97A2B;
    --amber-dark:#9C5A1B;
    --red:#B33A2E;
    --line:#DED4BC;
    --muted:#8A8272;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--green-900);
    color:var(--ink);
    min-height:100vh;
  }
  .app{
    display:grid;
    grid-template-columns:1fr 380px;
    min-height:100vh;
  }
  @media (max-width:860px){
    .app{grid-template-columns:1fr;}
    .receipt-col{order:-1;}
  }

  /* ===== LEFT: catalog ===== */
  .catalog-col{
    background:var(--green-900);
    padding:28px 32px 40px;
    color:var(--paper);
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .brand h1{
    font-size:22px;
    font-weight:800;
    margin:0;
    letter-spacing:0.2px;
  }
  .brand .sub{
    font-size:12.5px;
    color:#B9C9BE;
    margin-top:2px;
  }
  .clock{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    color:#B9C9BE;
    text-align:left;
  }
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .search-box{
    flex:1;
    min-width:180px;
    position:relative;
  }
  .search-box input{
    width:100%;
    padding:11px 14px;
    border-radius:10px;
    border:1px solid var(--green-700);
    background:var(--green-800);
    color:var(--paper);
    font-family:'Cairo',sans-serif;
    font-size:14.5px;
    outline:none;
  }
  .search-box input::placeholder{color:#8FA398;}
  .search-box input:focus{border-color:var(--amber);}
  .cat-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .cat-tab{
    padding:7px 14px;
    border-radius:20px;
    border:1px solid var(--green-700);
    background:transparent;
    color:#C8D6CC;
    font-family:'Cairo',sans-serif;
    font-size:13.5px;
    cursor:pointer;
  }
  .cat-tab.active{
    background:var(--amber);
    border-color:var(--amber);
    color:#2A1607;
    font-weight:700;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(140px,1fr));
    gap:12px;
  }
  .product{
    background:var(--green-800);
    border:1px solid var(--green-700);
    border-radius:12px;
    padding:14px 12px;
    cursor:pointer;
    text-align:right;
    transition:transform .08s ease, border-color .12s ease;
    position:relative;
  }
  .product:hover{border-color:var(--amber);}
  .product:active{transform:scale(0.97);}
  .product .name{
    font-size:14.5px;
    font-weight:600;
    color:var(--paper);
    margin-bottom:8px;
    line-height:1.3;
    min-height:37px;
  }
  .product .price{
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    font-weight:600;
    color:var(--amber);
  }
  .product .stockflag{
    position:absolute;
    top:10px;
    left:10px;
    font-size:10.5px;
    background:var(--red);
    color:#fff;
    padding:2px 7px;
    border-radius:6px;
  }
  .product.out{opacity:0.45;cursor:not-allowed;}
  .add-product-card{
    background:transparent;
    border:1px dashed var(--green-700);
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#8FA398;
    font-size:26px;
    cursor:pointer;
    min-height:82px;
  }
  .add-product-card:hover{border-color:var(--amber);color:var(--amber);}

  .manage-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:26px;
    padding-top:16px;
    border-top:1px solid var(--green-700);
  }
  .manage-row .stats{
    display:flex;
    gap:22px;
  }
  .stat{
    display:flex;
    flex-direction:column;
  }
  .stat .label{font-size:11.5px;color:#8FA398;}
  .stat .val{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600;color:var(--paper);}
  .ghost-btn{
    background:transparent;
    border:1px solid var(--green-700);
    color:#C8D6CC;
    padding:8px 14px;
    border-radius:9px;
    font-family:'Cairo',sans-serif;
    font-size:13px;
    cursor:pointer;
  }
  .ghost-btn:hover{border-color:var(--amber);color:var(--amber);}

  /* ===== RIGHT: receipt / cart ===== */
  .receipt-col{
    background:var(--paper);
    display:flex;
    flex-direction:column;
    padding:26px 24px;
    border-right:1px solid var(--line);
  }
  .receipt-head{
    text-align:center;
    padding-bottom:14px;
    border-bottom:2px dashed var(--line);
    margin-bottom:6px;
  }
  .receipt-head .title{
    font-weight:800;
    font-size:16px;
    letter-spacing:1px;
  }
  .receipt-head .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
  }
  .cart-list{
    flex:1;
    overflow-y:auto;
    padding:14px 0;
    min-height:120px;
  }
  .empty-cart{
    text-align:center;
    color:var(--muted);
    font-size:13.5px;
    margin-top:40px;
    line-height:1.8;
  }
  .cart-item{
    display:grid;
    grid-template-columns:1fr auto auto;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px dotted var(--line);
  }
  .cart-item .info .name{font-size:14px;font-weight:600;}
  .cart-item .info .unit{font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--muted);margin-top:2px;}
  .qty-ctrl{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--paper-dark);
    border-radius:8px;
    padding:3px;
  }
  .qty-ctrl button{
    width:22px;height:22px;
    border:none;
    background:#fff;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    line-height:1;
    color:var(--ink);
  }
  .qty-ctrl span{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    min-width:18px;
    text-align:center;
  }
  .line-total{
    font-family:'IBM Plex Mono',monospace;
    font-size:14px;
    font-weight:600;
    min-width:64px;
    text-align:left;
  }
  .remove-x{
    background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;
    padding:0 2px;
  }

  .totals{
    border-top:2px dashed var(--line);
    padding-top:14px;
    margin-top:6px;
  }
  .totals .row{
    display:flex;
    justify-content:space-between;
    font-size:13.5px;
    color:var(--muted);
    margin-bottom:6px;
    font-family:'IBM Plex Mono',monospace;
  }
  .totals .row.grand{
    color:var(--ink);
    font-size:22px;
    font-weight:700;
    margin-top:10px;
    padding-top:10px;
    border-top:1px solid var(--line);
  }
  .tax-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:4px;
    cursor:pointer;
    user-select:none;
  }

  .pay-block{margin-top:16px;}
  .pay-row{
    display:flex;
    gap:8px;
    margin-bottom:10px;
  }
  .pay-row input{
    flex:1;
    padding:11px 12px;
    border-radius:9px;
    border:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    text-align:left;
  }
  .pay-row input:focus{outline:none;border-color:var(--amber);}
  .keypad{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:6px;
    margin-bottom:10px;
  }
  .keypad button{
    padding:10px 0;
    border-radius:8px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'IBM Plex Mono',monospace;
    font-size:15px;
    cursor:pointer;
  }
  .keypad button:hover{border-color:var(--amber);}
  .change-line{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:12px;
    font-family:'IBM Plex Mono',monospace;
  }
  .change-line.negative{color:var(--red);}
  .change-line.ok{color:#2E7D4F;}
  .checkout-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:10px;
    background:var(--green-800);
    color:var(--paper);
    font-family:'Cairo',sans-serif;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
  }
  .checkout-btn:disabled{background:#C9C2AE;cursor:not-allowed;}
  .checkout-btn:not(:disabled):hover{background:var(--green-700);}
  .clear-btn{
    width:100%;
    padding:9px;
    margin-top:8px;
    border:none;
    background:none;
    color:var(--red);
    font-family:'Cairo',sans-serif;
    font-size:13px;
    cursor:pointer;
  }

  /* Modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(18,42,32,0.55);
    display:none;
    align-items:center;justify-content:center;
    z-index:50;
    padding:20px;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper);
    border-radius:14px;
    padding:24px;
    width:100%;
    max-width:380px;
  }
  .modal h3{margin:0 0 16px;font-size:17px;font-weight:700;}
  .modal label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px;}
  .modal input,.modal select{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid var(--line);
    font-family:'Cairo',sans-serif;
    font-size:14px;
  }
  .modal-actions{
    display:flex;
    gap:8px;
    margin-top:20px;
  }
  .modal-actions button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:none;
    font-family:'Cairo',sans-serif;
    font-size:14px;
    cursor:pointer;
  }
  .btn-primary{background:var(--green-800);color:var(--paper);}
  .btn-secondary{background:var(--paper-dark);color:var(--ink);}
  .btn-danger{background:transparent;color:var(--red);}

  .success-flash{
    position:fixed;
    bottom:24px;
    right:24px;
    left:24px;
    max-width:340px;
    margin:0 auto;
    background:#2E7D4F;
    color:#fff;
    padding:14px 18px;
    border-radius:10px;
    font-size:14px;
    font-weight:600;
    text-align:center;
    transform:translateY(120%);
    transition:transform .25s ease;
    z-index:60;
  }
  .success-flash.show{transform:translateY(0);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

  /* ===== Invoice modal ===== */
  .invoice-modal{
    max-width:420px;
    padding:0;
    overflow:hidden;
  }
  .invoice-sheet{
    background:#fff;
    padding:26px 24px 20px;
  }
  .invoice-sheet .head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
    padding-bottom:16px;
  }
  .invoice-sheet .shop-name{
    font-size:19px;
    font-weight:800;
    color:var(--green-800);
    margin:0 0 4px;
  }
  .invoice-sheet .shop-meta{
    font-size:12px;
    color:var(--muted);
    line-height:1.7;
  }
  .invoice-sheet .tag .title{
    font-size:20px;
    font-weight:800;
    color:var(--amber);
    margin:0 0 6px;
    text-align:left;
  }
  .invoice-sheet .tag .row{
    font-size:11.5px;
    color:var(--muted);
    text-align:left;
    font-family:'IBM Plex Mono',monospace;
  }
  .invoice-sheet .tag .row span{color:var(--ink);font-weight:600;}
  .invoice-sheet hr{
    border:none;
    border-top:2px dashed var(--line);
    margin:0 0 14px;
  }
  .invoice-sheet table.items{
    width:100%;
    border-collapse:collapse;
    margin-bottom:14px;
    font-size:13px;
  }
  .invoice-sheet table.items th{
    background:var(--green-800);
    color:#fff;
    font-size:12px;
    font-weight:700;
    padding:7px 8px;
    text-align:right;
  }
  .invoice-sheet table.items td{
    padding:7px 8px;
    border-bottom:1px dotted var(--line);
    font-family:'IBM Plex Mono',monospace;
  }
  .invoice-sheet table.items td.iname{font-family:'Cairo',sans-serif;}
  .invoice-sheet table.items tr:nth-child(even) td{background:var(--paper);}
  .invoice-sheet .totals{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
  }
  .invoice-sheet .totals .row{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    margin-bottom:4px;
  }
  .invoice-sheet .totals .row.grand{
    color:var(--green-800);
    font-size:19px;
    font-weight:700;
    border-top:1px solid var(--line);
    padding-top:8px;
    margin-top:6px;
  }
  .invoice-sheet .thanks{
    text-align:center;
    font-size:11.5px;
    color:var(--muted);
    border-top:2px dashed var(--line);
    margin-top:16px;
    padding-top:12px;
  }
  .invoice-modal-actions{
    display:flex;
    gap:8px;
    padding:14px 24px 20px;
  }
  .invoice-modal-actions button{
    flex:1;
    padding:11px;
    border-radius:9px;
    border:none;
    font-family:'Cairo',sans-serif;
    font-size:14px;
    cursor:pointer;
  }

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{
      position:absolute;
      inset:0;
      margin:0;
      padding:24px;
    }
    .overlay{position:absolute;background:none;}
  }
</style>
</head>
<body>

<div class="app">

  <div class="catalog-col">
    <div class="brand">
      <div>
        <h1>كاشير المحل</h1>
        <div class="sub">نظام نقاط بيع بسيط للمحل</div>
      </div>
      <div class="clock" id="clock"></div>
    </div>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ابحث عن منتج...">
      </div>
    </div>

    <div class="cat-tabs" id="catTabs"></div>

    <div class="grid" id="productGrid"></div>

    <div class="manage-row">
      <div class="stats">
        <div class="stat">
          <span class="label">مبيعات اليوم</span>
          <span class="val" id="todayTotal">0.00</span>
        </div>
        <div class="stat">
          <span class="label">عدد الفواتير</span>
          <span class="val" id="todayCount">0</span>
        </div>
      </div>
      <div style="display:flex;gap:8px;">
        <button class="ghost-btn" id="settingsBtn">بيانات المحل</button>
        <button class="ghost-btn" id="historyBtn">سجل المبيعات</button>
      </div>
    </div>
  </div>

  <div class="receipt-col">
    <div class="receipt-head">
      <div class="title">الفاتورة</div>
      <div class="num" id="receiptNum">#000001</div>
    </div>

    <div class="cart-list" id="cartList">
      <div class="empty-cart">السلة فارغة<br>اختر منتجاً من القائمة لإضافته</div>
    </div>

    <div class="totals">
      <label class="tax-toggle">
        <input type="checkbox" id="taxToggle" style="width:14px;height:14px;">
        تطبيق ضريبة 14%
      </label>
      <div class="row"><span>الإجمالي الفرعي</span><span id="subtotalVal">0.00</span></div>
      <div class="row" id="taxRow" style="display:none;"><span>الضريبة</span><span id="taxVal">0.00</span></div>
      <div class="row grand"><span>الإجمالي</span><span id="grandVal">0.00</span></div>
    </div>

    <div class="pay-block">
      <div class="pay-row">
        <input type="text" id="cashInput" placeholder="المبلغ المستلم" inputmode="decimal">
      </div>
      <div class="keypad">
        <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
        <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
        <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
        <button data-k="exact">دقيق</button><button data-k="0">0</button><button data-k="clear">مسح</button>
      </div>
      <div class="change-line" id="changeLine"><span>الباقي</span><span id="changeVal">0.00</span></div>
      <button class="checkout-btn" id="checkoutBtn" disabled>إتمام البيع</button>
      <button class="clear-btn" id="clearCartBtn">إفراغ السلة</button>
    </div>
  </div>

</div>

<div class="overlay" id="productOverlay">
  <div class="modal">
    <h3 id="productModalTitle">منتج جديد</h3>
    <input type="hidden" id="editProductId">
    <label>اسم المنتج</label>
    <input type="text" id="pName" placeholder="مثال: خبز بلدي">
    <label>السعر</label>
    <input type="text" id="pPrice" placeholder="0.00" inputmode="decimal">
    <label>الفئة</label>
    <input type="text" id="pCategory" placeholder="مثال: مخبوزات">
    <label>الكمية المتوفرة (اتركها فارغة لعدم التتبع)</label>
    <input type="text" id="pStock" placeholder="اختياري" inputmode="numeric">
    <div class="modal-actions">
      <button class="btn-danger" id="deleteProductBtn" style="display:none;">حذف</button>
      <button class="btn-secondary" id="cancelProductBtn">إلغاء</button>
      <button class="btn-primary" id="saveProductBtn">حفظ</button>
    </div>
  </div>
</div>

<div class="overlay" id="historyOverlay">
  <div class="modal" style="max-width:460px;">
    <h3>سجل المبيعات</h3>
    <div id="historyList" style="max-height:360px;overflow-y:auto;"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="closeHistoryBtn">إغلاق</button>
    </div>
  </div>
</div>

<div class="overlay" id="invoiceOverlay">
  <div class="modal invoice-modal">
    <div class="invoice-sheet" id="invoiceSheet"></div>
    <div class="invoice-modal-actions">
      <button class="btn-secondary" id="closeInvoiceBtn">إغلاق</button>
      <button class="btn-primary" id="printInvoiceBtn">طباعة الفاتورة</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>بيانات المحل</h3>
    <label>اسم المحل</label>
    <input type="text" id="shopNameInput" placeholder="اسم المحل">
    <label>العنوان</label>
    <input type="text" id="shopAddressInput" placeholder="العنوان بالتفصيل">
    <label>رقم الهاتف</label>
    <input type="text" id="shopPhoneInput" placeholder="رقم الهاتف">
    <div class="modal-actions">
      <button class="btn-secondary" id="cancelSettingsBtn">إلغاء</button>
      <button class="btn-primary" id="saveSettingsBtn">حفظ</button>
    </div>
  </div>
</div>

<div id="printArea" style="display:none;"></div>

<div class="success-flash" id="successFlash"></div>

<script>
const STORAGE_KEY_PRODUCTS = 'cashier:products';
const STORAGE_KEY_SALES = 'cashier:sales';
const STORAGE_KEY_COUNTER = 'cashier:invoice_counter';
const STORAGE_KEY_SHOP = 'cashier:shop_info';

let products = [];
let cart = [];
let sales = [];
let invoiceCounter = 1;
let activeCategory = 'الكل';
let searchQuery = '';
let shopInfo = { name: 'اسم المحل', address: 'العنوان بالتفصيل، المدينة', phone: '٠١٠٠٠٠٠٠٠٠٠' };

const defaultProducts = [
  {id:'p1', name:'خبز بلدي', price:3, category:'مخبوزات', stock:null},
  {id:'p2', name:'لبن كامل الدسم 1 لتر', price:28, category:'ألبان', stock:40},
  {id:'p3', name:'جبنة بيضاء 250 جم', price:35, category:'ألبان', stock:25},
  {id:'p4', name:'زيت عباد شمس 1 لتر', price:65, category:'بقالة', stock:15},
  {id:'p5', name:'أرز مصري 1 كجم', price:32, category:'بقالة', stock:50},
  {id:'p6', name:'سكر 1 كجم', price:30, category:'بقالة', stock:60},
  {id:'p7', name:'مياه معدنية 1.5 لتر', price:8, category:'مشروبات', stock:100},
  {id:'p8', name:'كوكاكولا 330 مل', price:12, category:'مشروبات', stock:80},
  {id:'p9', name:'شيبسي', price:10, category:'سناكس', stock:70},
  {id:'p10', name:'شوكولاتة', price:15, category:'سناكس', stock:45},
  {id:'p11', name:'صابون', price:18, category:'منظفات', stock:30},
  {id:'p12', name:'معجون أسنان', price:22, category:'منظفات', stock:20}
];

async function loadData(){
  try{
    const r = await window.storage.get(STORAGE_KEY_PRODUCTS);
    products = r ? JSON.parse(r.value) : defaultProducts;
  }catch(e){ products = defaultProducts; }
  try{
    const r = await window.storage.get(STORAGE_KEY_SALES);
    sales = r ? JSON.parse(r.value) : [];
  }catch(e){ sales = []; }
  try{
    const r = await window.storage.get(STORAGE_KEY_COUNTER);
    invoiceCounter = r ? JSON.parse(r.value) : 1;
  }catch(e){ invoiceCounter = 1; }
  try{
    const r = await window.storage.get(STORAGE_KEY_SHOP);
    if(r) shopInfo = JSON.parse(r.value);
  }catch(e){}
  renderAll();
}

async function saveProducts(){
  try{ await window.storage.set(STORAGE_KEY_PRODUCTS, JSON.stringify(products)); }catch(e){}
}
async function saveSales(){
  try{ await window.storage.set(STORAGE_KEY_SALES, JSON.stringify(sales)); }catch(e){}
}
async function saveCounter(){
  try{ await window.storage.set(STORAGE_KEY_COUNTER, JSON.stringify(invoiceCounter)); }catch(e){}
}
async function saveShopInfo(){
  try{ await window.storage.set(STORAGE_KEY_SHOP, JSON.stringify(shopInfo)); }catch(e){}
}

function fmt(n){
  return (Math.round(n*100)/100).toFixed(2);
}

function renderClock(){
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleString('ar-EG', {hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit'});
}
setInterval(renderClock, 1000*30);
renderClock();

function getCategories(){
  const cats = new Set(products.map(p=>p.category || 'عام'));
  return ['الكل', ...Array.from(cats)];
}

function renderCatTabs(){
  const wrap = document.getElementById('catTabs');
  wrap.innerHTML = '';
  getCategories().forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'cat-tab' + (cat===activeCategory ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = ()=>{ activeCategory = cat; renderCatTabs(); renderGrid(); };
    wrap.appendChild(btn);
  });
}

function renderGrid(){
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '';
  let list = products.filter(p=>{
    const matchCat = activeCategory==='الكل' || (p.category||'عام')===activeCategory;
    const matchSearch = !searchQuery || p.name.toLowerCase().includes(searchQuery.toLowerCase());
    return matchCat && matchSearch;
  });
  list.forEach(p=>{
    const card = document.createElement('div');
    const outOfStock = p.stock !== null && p.stock !== undefined && p.stock <= 0;
    card.className = 'product' + (outOfStock ? ' out' : '');
    card.innerHTML = `
      ${outOfStock ? '<span class="stockflag">نفذ</span>' : ''}
      <div class="name">${escapeHtml(p.name)}</div>
      <div class="price">${fmt(p.price)}</div>
    `;
    card.addEventListener('click', (e)=>{ addToCart(p.id); });
    card.addEventListener('contextmenu', (e)=>{ e.preventDefault(); openProductModal(p.id); });
    let pressTimer;
    card.addEventListener('touchstart', ()=>{ pressTimer = setTimeout(()=>openProductModal(p.id), 550); });
    card.addEventListener('touchend', ()=>clearTimeout(pressTimer));
    grid.appendChild(card);
  });
  const addCard = document.createElement('div');
  addCard.className = 'add-product-card';
  addCard.textContent = '+';
  addCard.onclick = ()=>openProductModal(null);
  grid.appendChild(addCard);
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function addToCart(productId){
  const p = products.find(x=>x.id===productId);
  if(!p) return;
  if(p.stock !== null && p.stock !== undefined && p.stock <= 0) return;
  const existing = cart.find(c=>c.id===productId);
  if(existing){
    existing.qty += 1;
  }else{
    cart.push({id:p.id, name:p.name, price:p.price, qty:1});
  }
  renderCart();
}

function changeQty(productId, delta){
  const item = cart.find(c=>c.id===productId);
  if(!item) return;
  item.qty += delta;
  if(item.qty <= 0){
    cart = cart.filter(c=>c.id!==productId);
  }
  renderCart();
}

function removeFromCart(productId){
  cart = cart.filter(c=>c.id!==productId);
  renderCart();
}

function renderCart(){
  const list = document.getElementById('cartList');
  list.innerHTML = '';
  if(cart.length === 0){
    list.innerHTML = '<div class="empty-cart">السلة فارغة<br>اختر منتجاً من القائمة لإضافته</div>';
  }else{
    cart.forEach(item=>{
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = `
        <div class="info">
          <div class="name">${escapeHtml(item.name)}</div>
          <div class="unit">${fmt(item.price)} × ${item.qty}</div>
        </div>
        <div class="qty-ctrl">
          <button class="minus">−</button>
          <span>${item.qty}</span>
          <button class="plus">+</button>
        </div>
        <div class="line-total">${fmt(item.price*item.qty)}</div>
      `;
      row.querySelector('.minus').onclick = ()=>changeQty(item.id, -1);
      row.querySelector('.plus').onclick = ()=>changeQty(item.id, 1);
      list.appendChild(row);
    });
  }
  updateTotals();
}

function getSubtotal(){
  return cart.reduce((s,i)=>s + i.price*i.qty, 0);
}

function updateTotals(){
  const sub = getSubtotal();
  const taxOn = document.getElementById('taxToggle').checked;
  const tax = taxOn ? sub*0.14 : 0;
  const grand = sub + tax;
  document.getElementById('subtotalVal').textContent = fmt(sub);
  document.getElementById('taxVal').textContent = fmt(tax);
  document.getElementById('taxRow').style.display = taxOn ? 'flex' : 'none';
  document.getElementById('grandVal').textContent = fmt(grand);
  document.getElementById('checkoutBtn').disabled = cart.length===0;
  updateChange();
}

function updateChange(){
  const sub = getSubtotal();
  const taxOn = document.getElementById('taxToggle').checked;
  const grand = sub + (taxOn ? sub*0.14 : 0);
  const cashRaw = document.getElementById('cashInput').value.replace(',', '.');
  const cash = parseFloat(cashRaw);
  const line = document.getElementById('changeLine');
  const val = document.getElementById('changeVal');
  if(isNaN(cash)){
    line.className = 'change-line';
    val.textContent = fmt(0);
    return;
  }
  const diff = cash - grand;
  val.textContent = fmt(Math.abs(diff));
  if(diff < 0){
    line.className = 'change-line negative';
    line.querySelector('span').textContent = 'المتبقي على العميل';
  }else{
    line.className = 'change-line ok';
    line.querySelector('span').textContent = 'الباقي للعميل';
  }
}

document.getElementById('taxToggle').addEventListener('change', updateTotals);
document.getElementById('cashInput').addEventListener('input', updateChange);

document.querySelectorAll('.keypad button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const k = btn.dataset.k;
    const input = document.getElementById('cashInput');
    if(k === 'clear'){
      input.value = '';
    }else if(k === 'exact'){
      const sub = getSubtotal();
      const taxOn = document.getElementById('taxToggle').checked;
      const grand = sub + (taxOn ? sub*0.14 : 0);
      input.value = fmt(grand);
    }else{
      input.value = (input.value || '') + k;
    }
    updateChange();
  });
});

document.getElementById('clearCartBtn').addEventListener('click', ()=>{
  cart = [];
  document.getElementById('cashInput').value = '';
  renderCart();
});

document.getElementById('checkoutBtn').addEventListener('click', async ()=>{
  if(cart.length===0) return;
  const sub = getSubtotal();
  const taxOn = document.getElementById('taxToggle').checked;
  const tax = taxOn ? sub*0.14 : 0;
  const grand = sub + tax;

  cart.forEach(item=>{
    const p = products.find(x=>x.id===item.id);
    if(p && p.stock !== null && p.stock !== undefined){
      p.stock = Math.max(0, p.stock - item.qty);
    }
  });
  await saveProducts();

  const sale = {
    id: invoiceCounter,
    items: cart.map(c=>({name:c.name, price:c.price, qty:c.qty})),
    subtotal: sub,
    tax: tax,
    total: grand,
    date: new Date().toISOString()
  };
  sales.push(sale);
  invoiceCounter += 1;
  await saveSales();
  await saveCounter();

  cart = [];
  document.getElementById('cashInput').value = '';
  document.getElementById('taxToggle').checked = false;
  renderCart();
  renderGrid();
  updateReceiptNum();
  updateTodayStats();
  showFlash(`تم إتمام البيع بنجاح — فاتورة #${String(sale.id).padStart(6,'0')}`);
  openInvoiceModal(sale);
});

function showFlash(msg){
  const el = document.getElementById('successFlash');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2600);
}

function buildInvoiceHtml(sale){
  const d = new Date(sale.date);
  const dateStr = d.toLocaleDateString('ar-EG');
  const rows = sale.items.map(it=>`
    <tr>
      <td class="iname">${escapeHtml(it.name)}</td>
      <td>${it.qty}</td>
      <td>${fmt(it.price)}</td>
      <td>${fmt(it.price*it.qty)}</td>
    </tr>
  `).join('');
  return `
    <div class="head">
      <div>
        <p class="shop-name">${escapeHtml(shopInfo.name)}</p>
        <div class="shop-meta">
          <div>${escapeHtml(shopInfo.address)}</div>
          <div>تليفون: ${escapeHtml(shopInfo.phone)}</div>
        </div>
      </div>
      <div class="tag">
        <p class="title">فاتورة</p>
        <div class="row">رقم: <span>${String(sale.id).padStart(6,'0')}</span></div>
        <div class="row">التاريخ: <span>${dateStr}</span></div>
      </div>
    </div>
    <hr>
    <table class="items">
      <thead>
        <tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="totals">
      <div class="row"><span>الإجمالي الفرعي</span><span>${fmt(sale.subtotal)}</span></div>
      ${sale.tax > 0 ? `<div class="row"><span>الضريبة</span><span>${fmt(sale.tax)}</span></div>` : ''}
      <div class="row grand"><span>الإجمالي المستحق</span><span>${fmt(sale.total)}</span></div>
    </div>
    <div class="thanks">شكراً لتعاملكم معنا</div>
  `;
}

function openInvoiceModal(sale){
  document.getElementById('invoiceSheet').innerHTML = buildInvoiceHtml(sale);
  document.getElementById('invoiceOverlay').classList.add('show');
}

document.getElementById('closeInvoiceBtn').addEventListener('click', ()=>{
  document.getElementById('invoiceOverlay').classList.remove('show');
});

document.getElementById('printInvoiceBtn').addEventListener('click', ()=>{
  const printArea = document.getElementById('printArea');
  printArea.innerHTML = document.getElementById('invoiceSheet').innerHTML;
  printArea.style.display = 'block';
  window.print();
  printArea.style.display = 'none';
});

document.getElementById('settingsBtn').addEventListener('click', ()=>{
  document.getElementById('shopNameInput').value = shopInfo.name;
  document.getElementById('shopAddressInput').value = shopInfo.address;
  document.getElementById('shopPhoneInput').value = shopInfo.phone;
  document.getElementById('settingsOverlay').classList.add('show');
});

document.getElementById('cancelSettingsBtn').addEventListener('click', ()=>{
  document.getElementById('settingsOverlay').classList.remove('show');
});

document.getElementById('saveSettingsBtn').addEventListener('click', async ()=>{
  shopInfo.name = document.getElementById('shopNameInput').value.trim() || 'اسم المحل';
  shopInfo.address = document.getElementById('shopAddressInput').value.trim();
  shopInfo.phone = document.getElementById('shopPhoneInput').value.trim();
  await saveShopInfo();
  document.getElementById('settingsOverlay').classList.remove('show');
});

function updateReceiptNum(){
  document.getElementById('receiptNum').textContent = '#' + String(invoiceCounter).padStart(6,'0');
}

function updateTodayStats(){
  const today = new Date().toDateString();
  const todaySales = sales.filter(s=>new Date(s.date).toDateString()===today);
  const total = todaySales.reduce((s,x)=>s+x.total, 0);
  document.getElementById('todayTotal').textContent = fmt(total);
  document.getElementById('todayCount').textContent = todaySales.length;
}

document.getElementById('searchInput').addEventListener('input', (e)=>{
  searchQuery = e.target.value;
  renderGrid();
});

function openProductModal(productId){
  const overlay = document.getElementById('productOverlay');
  const title = document.getElementById('productModalTitle');
  const deleteBtn = document.getElementById('deleteProductBtn');
  document.getElementById('editProductId').value = productId || '';
  if(productId){
    const p = products.find(x=>x.id===productId);
    title.textContent = 'تعديل المنتج';
    document.getElementById('pName').value = p.name;
    document.getElementById('pPrice').value = p.price;
    document.getElementById('pCategory').value = p.category || '';
    document.getElementById('pStock').value = (p.stock===null||p.stock===undefined) ? '' : p.stock;
    deleteBtn.style.display = 'block';
  }else{
    title.textContent = 'منتج جديد';
    document.getElementById('pName').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pCategory').value = '';
    document.getElementById('pStock').value = '';
    deleteBtn.style.display = 'none';
  }
  overlay.classList.add('show');
}

document.getElementById('cancelProductBtn').addEventListener('click', ()=>{
  document.getElementById('productOverlay').classList.remove('show');
});

document.getElementById('saveProductBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('editProductId').value;
  const name = document.getElementById('pName').value.trim();
  const priceRaw = document.getElementById('pPrice').value.replace(',', '.');
  const price = parseFloat(priceRaw);
  const category = document.getElementById('pCategory').value.trim() || 'عام';
  const stockRaw = document.getElementById('pStock').value.trim();
  const stock = stockRaw === '' ? null : parseInt(stockRaw, 10);

  if(!name){
    alert('من فضلك اكتب اسم المنتج');
    return;
  }
  if(isNaN(price) || price < 0){
    alert('من فضلك اكتب سعراً صحيحاً');
    return;
  }

  if(id){
    const p = products.find(x=>x.id===id);
    p.name = name; p.price = price; p.category = category; p.stock = stock;
  }else{
    const newId = 'p' + Date.now();
    products.push({id:newId, name, price, category, stock});
  }
  await saveProducts();
  document.getElementById('productOverlay').classList.remove('show');
  renderCatTabs();
  renderGrid();
});

document.getElementById('deleteProductBtn').addEventListener('click', async ()=>{
  const id = document.getElementById('editProductId').value;
  if(!id) return;
  if(!confirm('هل تريد حذف هذا المنتج؟')) return;
  products = products.filter(x=>x.id!==id);
  await saveProducts();
  document.getElementById('productOverlay').classList.remove('show');
  renderCatTabs();
  renderGrid();
});

document.getElementById('historyBtn').addEventListener('click', ()=>{
  const list = document.getElementById('historyList');
  list.innerHTML = '';
  if(sales.length === 0){
    list.innerHTML = '<div style="color:var(--muted);font-size:13.5px;text-align:center;padding:20px 0;">لا توجد مبيعات مسجلة بعد</div>';
  }else{
    sales.slice().reverse().forEach(s=>{
      const d = new Date(s.date);
      const row = document.createElement('div');
      row.style.cssText = 'padding:10px 0;border-bottom:1px dotted var(--line);display:flex;justify-content:space-between;align-items:center;font-size:13.5px;gap:10px;';
      row.innerHTML = `
        <div>
          <div style="font-weight:600;">فاتورة #${String(s.id).padStart(6,'0')}</div>
          <div style="color:var(--muted);font-size:11.5px;font-family:'IBM Plex Mono',monospace;">${d.toLocaleString('ar-EG')}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;">${fmt(s.total)}</span>
          <button class="reprint-btn" data-id="${s.id}" style="border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-family:'Cairo',sans-serif;font-size:12px;cursor:pointer;">عرض</button>
        </div>
      `;
      row.querySelector('.reprint-btn').addEventListener('click', ()=>{
        document.getElementById('historyOverlay').classList.remove('show');
        openInvoiceModal(s);
      });
      list.appendChild(row);
    });
  }
  document.getElementById('historyOverlay').classList.add('show');
});

document.getElementById('closeHistoryBtn').addEventListener('click', ()=>{
  document.getElementById('historyOverlay').classList.remove('show');
});

function renderAll(){
  renderCatTabs();
  renderGrid();
  renderCart();
  updateReceiptNum();
  updateTodayStats();
}

loadData();
</script>
